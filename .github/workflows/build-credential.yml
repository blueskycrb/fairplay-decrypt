name: Build iPad credential tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install signing tool
        run: brew install ldid
      - name: Build device tools
        run: make -C credential-retrieval
      - name: Preserve executable permissions
        run: tar -czf credential-tools.tar.gz -C credential-retrieval/build bundle
      - uses: actions/upload-artifact@v4
        with:
          name: credential-tools
          path: credential-tools.tar.gz
          if-no-files-found: error
